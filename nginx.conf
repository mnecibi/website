server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The p5 bundle is ~1 MB uncompressed and ~264 KB gzipped.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/css application/javascript application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Build outputs are rebuilt on every deploy but keep their names, so they
    # get a short cache and revalidate.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate";
    }

    location ~* \.(?:png|ico|ttf|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
